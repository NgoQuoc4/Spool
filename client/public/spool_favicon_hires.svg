<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Modern Dark Squircle App Container (radius 112px = 22%) -->
  <rect width="512" height="512" rx="112" fill="#10141e" />
  
  <!-- Subtle border definition -->
  <rect width="512" height="512" rx="112" fill="none" stroke="#253147" stroke-width="4" />

  <!-- Centered Spool Vortex Mark (Scaled 2x on 512 grid) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Spindle core dot -->
    <circle cx="256" cy="256" r="40" fill="#38bdf8" />

    <!-- Upper winding thread arm -->
    <path stroke="#f8fafc" stroke-width="52" d="
      M 112,256
      A 144,144 0 0,1 400,256
      C 400,336 336,396 256,396
      C 196,396 148,356 148,304
    " />

    <!-- Lower winding thread arm -->
    <path stroke="#f8fafc" stroke-width="52" d="
      M 400,256
      A 144,144 0 0,1 112,256
      C 112,176 176,116 256,116
      C 316,116 364,156 364,208
    " />
  </g>
</svg>